name: Keller stock monitor

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose a stock check or send a test email"
        required: true
        default: stock_check
        type: choice
        options:
          - stock_check
          - test_email

permissions:
  contents: write

concurrency:
  group: keller-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_mode == 'stock_check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile monitor.py
      - name: Check product stock
        env:
          MONITOR_MODE: stock_check
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py
      - name: Save stock state
        run: |
          if ! git diff --quiet -- data/stock_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stock_state.json
            git commit -m "Update monitored stock state"
            git push
          fi

  test-email:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'test_email' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile monitor.py
      - name: Send test email
        env:
          MONITOR_MODE: test_email
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py
